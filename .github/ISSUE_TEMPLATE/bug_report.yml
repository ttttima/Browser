name: Bug report
description: Something in Nya doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nya version
      placeholder: '0.1.0'
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: 'Windows 11 24H2'
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here if they help.
